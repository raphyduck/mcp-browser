networks:
  default:
  mcp_edge:
    external: true

services:
  human-browser-mcp:
    init: true
    mem_limit: 1536m
    memswap_limit: 1536m
    image: human-browser-mcp:latest
    build:
      context: ./human-browser-mcp
    environment:
      - HEADLESS=false
      - MCP_TRANSPORT=http
      - MCP_PORT=3000
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-human-browser-mcp}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-https://brmcp.hobbitton.at}
      - BROWSER_TIMEOUT=30000
      - CAPSOLVER_API_KEY=${CAPSOLVER_API_KEY:-}
      - PROXY_SERVER=${PROXY_SERVER:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
      - RELAY_PUBLIC=${RELAY_PUBLIC:-}
    volumes:
      - browser_profile:/app/profile
      - /home/raph/docker_images/_shared/imap-attachments:/root/Downloads/imap-attachments:rw   # depot partage avec imapmcp (browser_upload_file)
    restart: unless-stopped
    shm_size: '2gb'
    networks:
      - default
      - mcp_edge
    labels:
      caddy: http://brmcp.hobbitton.at
      caddy.reverse_proxy: "{{upstreams 3000}}"

volumes:
  browser_profile:
